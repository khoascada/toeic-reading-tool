services:
  postgres:
    image: postgres:16-alpine
    container_name: toeic_reading_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-toeic_reading}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_super_secret_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-toeic_reading}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: toeic_reading_postgres_data 
    driver: local

